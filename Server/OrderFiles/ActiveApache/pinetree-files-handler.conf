# Route only this API to its private daemon-user PHP pool.
# Keep the current domain certificate and virtual host configuration intact.
<Directory /opt/lampp/htdocs/pinetreefiles>
    Options -Indexes
    AllowOverride None
    Require all granted
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/pinetree-files.sock|fcgi://localhost"
    </FilesMatch>
</Directory>
