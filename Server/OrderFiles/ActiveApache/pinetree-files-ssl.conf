# Candidate for /etc/httpd/conf.d/pinetree-files-ssl.conf.
# Uses the existing valid certificate; leaves the default SSL virtual host intact.
<VirtualHost *:443>
    ServerName yeowoosai.co.kr
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/yeowoosai.co.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yeowoosai.co.kr/privkey.pem

    Alias /pinetreefiles/ /opt/lampp/htdocs/pinetreefiles/
    <Directory /opt/lampp/htdocs/pinetreefiles>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php-fpm/pinetree-files.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    ErrorLog logs/pinetree-files-ssl-error.log
    CustomLog logs/pinetree-files-ssl-access.log combined
</VirtualHost>
