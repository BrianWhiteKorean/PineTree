; Candidate for /etc/php-fpm.d/pinetree-files.conf.
; Keep the existing private files and settings owned by daemon.
[pinetree-files]
user = daemon
group = daemon
listen = /run/php-fpm/pinetree-files.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
catch_workers_output = yes
